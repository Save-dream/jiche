# 极车 Nginx 配置示例
# 安装：
#   sudo cp /home/jiche/deploy/nginx.jiche.conf /etc/nginx/sites-available/jiche
#   sudo ln -sf /etc/nginx/sites-available/jiche /etc/nginx/sites-enabled/jiche
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 把下面的 server_name 改成你的域名或公网 IP

server {
    listen 80;
    server_name _;   # 改成: your.domain.com 或 公网IP

    # 前端静态（Vue build 产物）
    root /home/jiche/jiche-frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # Vue History 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（勿对 SPA 做激进 limit_req，否则首屏并发易 503）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传图片
    location /media/ {
        alias /home/jiche/jiche-backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 禁止直接访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
